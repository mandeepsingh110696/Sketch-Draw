<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Paper tile: matches app canvas feel -->
  <rect width="32" height="32" rx="8" fill="#f4f4f5"/>
  <!-- Soft edge so it reads on light browser chrome -->
  <rect
    x="0.5"
    y="0.5"
    width="31"
    height="31"
    rx="7.5"
    stroke="#d4d4d8"
    stroke-width="1"
  />
  <!-- Single sketch stroke + tail: reads clearly at favicon size -->
  <path
    fill="none"
    stroke="#18181b"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M7 21.5C11 11 18 7.5 25 10"
  />
  <path
    fill="none"
    stroke="#18181b"
    stroke-width="2.2"
    stroke-linecap="round"
    opacity="0.35"
    d="M6.5 24.5c3.5 1.2 7.8 0.5 10.5-2"
  />
</svg>
